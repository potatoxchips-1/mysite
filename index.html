<style>
/* Layout: sticky identity card on the left, quick links and details stacked on the right; one column on phones */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #5b6b78;
  --line: #d6dde3;
  --accent: #0b7a6b;
  --accent-fg: #ffffff;
  --accent-soft: #dff1ee;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1519; --surface: #151e24; --fg: #e4ecef; --muted: #93a4ae;
    --line: #26323a; --accent: #3fd1b5; --accent-fg: #06201b; --accent-soft: #14312d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1519; --surface: #151e24; --fg: #e4ecef; --muted: #93a4ae;
  --line: #26323a; --accent: #3fd1b5; --accent-fg: #06201b; --accent-soft: #14312d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1040px; margin: 0 auto;
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: start;
}
@media (max-width: 800px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* identity card */
.id {
  position: sticky; top: 24px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
@media (max-width: 800px) { .id { position: static; } }
.photo {
  width: 112px; height: 112px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-weight: 700; font-size: 40px;
  border: 1px solid var(--line);
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.id h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1;
  margin: 0; text-wrap: balance; letter-spacing: -0.01em;
}
.role { margin: 0; color: var(--muted); }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.facts li { display: flex; gap: 12px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
.facts span:first-child { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--accent-fg); text-decoration: none;
  font-weight: 600; padding: 11px 16px; border-radius: 10px; border: 0; cursor: pointer; font-size: 15px;
}
.btn:hover { filter: brightness(1.08); }
.btn.alt { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; flex-direction: column; gap: 8px; }
.theme {
  align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--muted);
  border-radius: 8px; padding: 6px 10px; font: 500 12px var(--font-mono); cursor: pointer;
}
.theme:hover { color: var(--fg); border-color: var(--muted); }

/* main column */
main { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
.label {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 12px;
}
.about { font-size: 18px; max-width: 62ch; margin: 0; text-wrap: pretty; }

.links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .links { grid-template-columns: minmax(0, 1fr); } }
.link {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px;
}
.link a {
  flex: 1; min-width: 0; text-decoration: none; display: flex; flex-direction: column; padding: 6px 0;
}
.link a:hover .name { color: var(--accent); }
.link .name { font-weight: 600; }
.link .handle { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy {
  flex: none; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 8px;
  padding: 8px 12px; font: 600 12px var(--font-mono); cursor: pointer; min-width: 64px;
}
.copy:hover { filter: brightness(0.96); }
.copy.view { background: var(--accent); color: var(--accent-fg); text-decoration: none; text-align: center; min-width: 58px; }
.copy.view:hover { filter: brightness(1.08); }

.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 20px;
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr); } }
.when { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.row h3 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 500; line-height: 1.25; }
.row p { margin: 4px 0 0; color: var(--muted); }
.row a.go { display: inline-block; margin-top: 6px; color: var(--accent); font-weight: 600; font-size: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 13px; font-size: 14px;
}
.note {
  font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px;
}
.note code { font-family: var(--font-mono); font-size: 12px; }
</style>

  <main>

    <section>

    <section>

    <section>

    </section>

    <section>
      <h2 class="label">Certificates and awards</h2>
      <div class="list" id="certs"></div>
    </section>

  </main>
</div>

function blobUrl(b64, type) {
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: type }));
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderRows(id, items) {
  var box = document.getElementById(id);
  items.forEach(function (it) {
    var row = el("div", "row");
    row.appendChild(el("div", "when", it.when));
    var body = el("div");
    body.appendChild(el("h3", null, it.title));
    if (it.sub) body.appendChild(el("p", null, it.sub));
    if (it.url) {
      var a = el("a", "go", "View project");
      a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      body.appendChild(a);
    }
    row.appendChild(body);
    box.appendChild(row);
  });
}

function copyText(text, btn) {
  function done(msg) {
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = "Copy"; }, 1400);
  }
  function fallback() {
    var t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
    done(ok ? "Copied" : "Select it");
  }
  try {
    navigator.clipboard.writeText(text).then(function () { done("Copied"); }, fallback);
  } catch (e) { fallback(); }
}

(function render() {
  document.getElementById("name").textContent = ME.name;
  document.getElementById("role").textContent = ME.role;
  document.getElementById("about").textContent = ME.about;

  var photo = document.getElementById("photo");
  if (ME.photo) {
    var img = document.createElement("img");
    img.src = ME.photo; img.alt = ME.name;
    photo.appendChild(img);
  } else {
    photo.textContent = ME.name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
  }

  var facts = document.getElementById("facts");
  ME.facts.forEach(function (f) {
    var li = el("li");
    li.appendChild(el("span", null, f[0]));
    li.appendChild(el("span", null, f[1]));
    facts.appendChild(li);
  });

  var pdfUrl = blobUrl(RESUME_B64, "application/pdf");
  var dl = document.getElementById("resumeDl");
  dl.href = pdfUrl; dl.setAttribute("download", "Pranav_Rajesh_Resume.pdf");
  var view = document.getElementById("resumeView");
  view.href = pdfUrl; view.target = "_blank"; view.rel = "noopener";
  var pdl = document.getElementById("photoDl");
  pdl.href = blobUrl(ME.photo.split(",")[1], "image/jpeg");
  pdl.setAttribute("download", "Pranav_Rajesh_Photo.jpg");

  var links = document.getElementById("links");
  ME.links.forEach(function (l) {
    var box = el("div", "link");
    var a = el("a");
    a.href = l.url;
    if (/^https?:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
    a.appendChild(el("span", "name", l.name));
    a.appendChild(el("span", "handle", l.handle));
    var b = el("button", "copy", "Copy");
    b.type = "button";
    b.setAttribute("aria-label", "Copy " + l.name);
    b.addEventListener("click", function () { copyText(l.handle, b); });
    var v = el("a", "copy view", /^https?:/.test(l.url) ? "View" : "Open");
    v.href = l.url;
    if (/^https?:/.test(l.url)) { v.target = "_blank"; v.rel = "noopener"; }
    v.setAttribute("aria-label", "Open " + l.name);
    box.appendChild(a); box.appendChild(v); box.appendChild(b);
    links.appendChild(box);
  });

  renderRows("education", ME.education);
  renderRows("projects", ME.projects);
  renderRows("certs", ME.certs);

  var skills = document.getElementById("skills");
  ME.skills.forEach(function (s) { skills.appendChild(el("span", "chip", s)); });
})();

/* theme toggle: auto -> light -> dark */
(function () {
  var btn = document.getElementById("themeBtn");
  var modes = ["auto", "light", "dark"], i = 0;
  btn.addEventListener("click", function () {
    i = (i + 1) % 3;
    var root = document.documentElement;
    if (modes[i] === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", modes[i]);
    btn.textContent = "Theme: " + modes[i];
  });
})();
